<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Pública Bolivia</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 1600px; margin: 0 auto; } /* Hice el contenedor más ancho para que quepan las columnas */
        
        h1 { color: #ff4444; text-align: center; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 2px; }
        p.subtitle { text-align: center; color: #888; margin-bottom: 25px; font-size: 14px; }

        /* --- BUSCADOR --- */
        .search-container { text-align: center; margin-bottom: 20px; }
        .search-box { 
            width: 100%; max-width: 500px; padding: 12px 20px; font-size: 16px; 
            border-radius: 25px; border: 1px solid #444; background: #222; color: white; outline: none;
        }
        .search-box:focus { border-color: #ff4444; background: #333; }

        /* --- TABLA --- */
        .table-responsive { overflow-x: auto; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; min-width: 1200px; }
        
        thead { background: #b71c1c; color: white; }
        th { padding: 15px 10px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
        td { padding: 12px 10px; border-bottom: 1px solid #333; font-size: 13px; vertical-align: top; color: #ddd; }
        
        /* Filas Zebra */
        tr:nth-child(even) { background-color: #252525; }
        tr:hover { background-color: #333; transition: 0.2s; }

        /* --- ANCHOS DE COLUMNAS --- */
        .col-nro { width: 50px; text-align: center; font-weight: bold; color: #ff4444; }
        .col-nombre { font-weight: bold; color: #fff; width: 200px; font-size: 14px; }
        .col-datos { width: 180px; color: #aaa; font-size: 12px; line-height: 1.6; }
        .col-historia { min-width: 300px; line-height: 1.5; color: #ccc; white-space: pre-wrap; } 
        .col-extra { width: 150px; font-size: 12px; }
        .col-pruebas { width: 80px; text-align: center; }

        /* --- ETIQUETAS (TAGS) --- */
        .tag { display: inline-block; padding: 2px 6px; border-radius: 3px; background: #333; color: #fff; font-size: 11px; margin-right: 4px; margin-bottom: 2px; }
        .tag-depto { background: #0d47a1; } 
        .tag-its { background: #d32f2f; color: white; font-weight: bold; }
        .tag-ok { background: #2e7d32; }

        /* --- BOTÓN PRUEBAS --- */
        .btn-link { 
            display: inline-block; padding: 5px 10px; background: #222; color: #4fa3ff; 
            text-decoration: none; border: 1px solid #4fa3ff; border-radius: 4px; font-size: 11px; font-weight: bold;
        }
        .btn-link:hover { background: #4fa3ff; color: #000; }

        /* --- PAGINACIÓN --- */
        .pagination { display: flex; justify-content: center; gap: 5px; margin-top: 25px; align-items: center; flex-wrap: wrap; }
        .page-btn { 
            background: #333; color: white; border: 1px solid #444; padding: 8px 12px; 
            border-radius: 4px; cursor: pointer; font-size: 14px; min-width: 40px;
        }
        .page-btn:hover { background: #555; border-color: #666; }
        .page-btn.active { background: #ff4444; border-color: #ff4444; font-weight: bold; }
        .page-btn:disabled { background: #222; color: #555; border-color: #333; cursor: not-allowed; }
        
        .nav-btn { font-weight: bold; background: #b71c1c; border: none; } /* Botones Inicio/Fin rojos */

    </style>
</head>
<body>

<div class="container">
    <h1>Base de Datos - Bolivia</h1>
    <p class="subtitle">Consulta Pública v4.0</p>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Buscar por Nombre, Apodo o Ciudad...">
    </div>

    <div id="loading" style="text-align: center; margin: 40px; color: #ff4444;">Cargando base de datos completa...</div>

    <div class="table-responsive">
        <table id="dataTable">
            <thead>
                <tr>
                    <th style="text-align:center;">#</th>
                    <th>Nombre Completo</th>
                    <th>Perfil</th>
                    <th>Historia / Descripción</th>
                    <th>Salud / Redes</th>
                    <th style="text-align: center;">Pruebas</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="pagination" id="paginationContainer" style="display:none;"></div>
</div>

<script>
    // ==========================================
    // ¡PEGA TU ENLACE CSV AQUÍ ABAJO!
    // ==========================================
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQuyZr5BY-sQrkjkd55DObWEQ4Jq-IN5orJciSlCHGKKvkPSMwMWhUuBAZn7fWpKUQKlMS4HybiFfz2/pub?gid=0&single=true&output=csv';

    let allData = [];
    let filteredData = [];
    let currentPage = 1;
    const itemsPerPage = 50; // Cantidad de infieles por página

    async function loadData() {
        try {
            // Añadimos timestamp para evitar caché viejo
            const response = await fetch(sheetUrl + '&v=' + Date.now());
            const text = await response.text();
            
            allData = parseCSVAdvanced(text);
            
            // Si quieres ordenar por número (Columna A), descomenta la siguiente línea:
            // allData.sort((a, b) => parseInt(a.nro) - parseInt(b.nro));

            // Si prefieres Orden Alfabético por Nombre, deja esta activa:
            allData.sort((a, b) => a.nombre.toLowerCase().localeCompare(b.nombre.toLowerCase()));

            filteredData = allData;
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('paginationContainer').style.display = 'flex';
            renderTable();
            renderPagination();
        } catch (error) {
            console.error(error);
            document.getElementById('loading').innerHTML = 'Error al cargar. Verifica el enlace CSV.';
        }
    }

    // Parser que lee TODAS tus columnas nuevas
    function parseCSVAdvanced(text) {
        const rows = [];
        let currentRow = [];
        let currentCell = '';
        let insideQuote = false;

        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            const nextChar = text[i + 1];

            if (char === '"') {
                if (insideQuote && nextChar === '"') { currentCell += '"'; i++; } 
                else { insideQuote = !insideQuote; }
            } else if (char === ',' && !insideQuote) {
                currentRow.push(currentCell.trim());
                currentCell = '';
            } else if ((char === '\r' || char === '\n') && !insideQuote) {
                if (currentCell || currentRow.length > 0) { currentRow.push(currentCell.trim()); rows.push(currentRow); }
                currentRow = []; currentCell = '';
                if (char === '\r' && nextChar === '\n') i++;
            } else { currentCell += char; }
        }
        if (currentCell || currentRow.length > 0) { currentRow.push(currentCell.trim()); rows.push(currentRow); }

        // Mapeo EXACTO de tus columnas (Basado en Sheet v4)
        return rows.slice(6).map(row => {
            if(row.length < 2) return null;
            return {
                nro: row[0] || '-',            // Col A
                nombre: row[1] || 'Anónimo',   // Col B
                genero: row[2] || '',          // Col C
                edad: row[3] || '?',           // Col D
                depto: row[4] || '',           // Col E
                ciudad: row[5] || '',          // Col F
                profesion: row[6] || '',       // Col G
                donde: row[7] || '',           // Col H (Nuevo)
                historia: row[8] || '',        // Col I
                its: row[9] || '',             // Col J (Nuevo)
                redes: row[10] || '',          // Col K (Nuevo)
                pruebas: row[11] || ''         // Col L
            };
        }).filter(item => item && item.nombre && !item.nombre.includes('Nombre completo'));
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const pageItems = filteredData.slice(start, end);

        if(pageItems.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 30px;">No se encontraron resultados</td></tr>';
            return;
        }

        pageItems.forEach(item => {
            // Lógica para color de ITS (Rojo si dice Sí)
            let itsBadge = '';
            if(item.its) {
                const text = item.its.toLowerCase();
                if(text.includes('si') || text.includes('sí')) itsBadge = `<div class="tag tag-its">⚠️ ITS: ${item.its}</div>`;
                else if(text.includes('no')) itsBadge = `<div class="tag tag-ok">Salud: ${item.its}</div>`;
                else itsBadge = `<div class="tag">Salud: ${item.its}</div>`;
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="col-nro">${item.nro}</td>
                <td class="col-nombre">${item.nombre}</td>
                <td class="col-datos">
                    ${item.depto ? `<span class="tag tag-depto">${item.depto}</span>` : ''}
                    <br>📍 ${item.ciudad}
                    <br>🎂 ${item.edad} años
                    <br>💼 ${item.profesion}
                    <br>👀 <i>Conocido en: ${item.donde}</i>
                </td>
                <td class="col-historia">${item.historia}</td>
                <td class="col-extra">
                    ${itsBadge}
                    ${item.redes ? `<div style="margin-top:5px; font-size:11px; color:#4fa3ff;">🔗 ${item.redes}</div>` : ''}
                </td>
                <td class="col-pruebas">
                    ${item.pruebas ? `<a href="${item.pruebas}" target="_blank" class="btn-link">VER</a>` : '<span style="color:#444;">-</span>'}
                </td>
            `;
            tbody.appendChild(tr);
        });
        
        // Volver arriba
        window.scrollTo(0, 0);
    }

    function renderPagination() {
        const container = document.getElementById('paginationContainer');
        container.innerHTML = '';
        
        const totalPages = Math.ceil(filteredData.length / itemsPerPage);
        if (totalPages <= 1) return;

        // Botón Inicio
        const startBtn = createBtn('« Inicio', () => goToPage(1), currentPage === 1);
        startBtn.classList.add('nav-btn');
        container.appendChild(startBtn);

        // Botón Anterior
        container.appendChild(createBtn('‹ Ant', () => goToPage(currentPage - 1), currentPage === 1));

        // Números (Ventana de 5 páginas alrededor de la actual para no llenar la pantalla)
        let startPage = Math.max(1, currentPage - 2);
        let endPage = Math.min(totalPages, startPage + 4);
        
        if (endPage - startPage < 4) {
            startPage = Math.max(1, endPage - 4);
        }

        for (let i = startPage; i <= endPage; i++) {
            const btn = createBtn(i, () => goToPage(i), false);
            if (i === currentPage) btn.classList.add('active');
            container.appendChild(btn);
        }

        // Botón Siguiente
        container.appendChild(createBtn('Sig ›', () => goToPage(currentPage + 1), currentPage === totalPages));

        // Botón Final
        const endBtn = createBtn('Final »', () => goToPage(totalPages), currentPage === totalPages);
        endBtn.classList.add('nav-btn');
        container.appendChild(endBtn);
    }

    function createBtn(text, onClick, disabled) {
        const btn = document.createElement('button');
        btn.innerText = text;
        btn.className = 'page-btn';
        btn.disabled = disabled;
        btn.addEventListener('click', onClick);
        return btn;
    }

    function goToPage(page) {
        currentPage = page;
        renderTable();
        renderPagination();
    }

    // Buscador
    document.getElementById('searchInput').addEventListener('keyup', (e) => {
        const term = e.target.value.toLowerCase();
        filteredData = allData.filter(item => 
            item.nombre.toLowerCase().includes(term) || 
            item.depto.toLowerCase().includes(term) || 
            item.nro.toString().includes(term)
        );
        currentPage = 1;
        renderTable();
        renderPagination();
    });

    loadData();
</script>

</body>
</html>
