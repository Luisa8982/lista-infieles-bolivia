<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Pública Bolivia</title>
    <style>
        /* ESTILO GENERAL OSCURO */
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 1300px; margin: 0 auto; }
        
        h1 { color: #ff4444; text-align: center; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 2px; }
        p.subtitle { text-align: center; color: #888; margin-bottom: 25px; font-size: 14px; }

        /* BUSCADOR */
        .search-container { text-align: center; margin-bottom: 20px; }
        .search-box { 
            width: 100%; max-width: 500px; padding: 12px 20px; font-size: 16px; 
            border-radius: 25px; border: 1px solid #444; background: #222; color: white; outline: none;
        }
        .search-box:focus { border-color: #ff4444; background: #333; }

        /* TABLA (DISEÑO TIPO EXCEL) */
        .table-responsive { overflow-x: auto; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; min-width: 900px; }
        
        thead { background: #b71c1c; color: white; }
        th { padding: 15px; text-align: left; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 12px 15px; border-bottom: 1px solid #333; font-size: 14px; vertical-align: top; color: #ddd; }
        
        /* Filas intercaladas */
        tr:nth-child(even) { background-color: #252525; }
        tr:hover { background-color: #333; transition: 0.2s; }

        /* Estilo de columnas */
        .col-nombre { font-weight: bold; color: #fff; width: 22%; font-size: 15px; }
        .col-datos { width: 18%; color: #aaa; font-size: 13px; line-height: 1.6; }
        .col-historia { width: 50%; line-height: 1.5; color: #ccc; }
        .col-pruebas { width: 10%; text-align: center; }

        /* Etiquetas pequeñas */
        .tag { display: inline-block; padding: 2px 6px; border-radius: 3px; background: #333; color: #fff; font-size: 11px; margin-right: 4px; }
        .tag-depto { background: #0d47a1; } /* Azul para depto */

        /* Botón Link */
        .btn-link { 
            display: inline-block; padding: 6px 12px; background: #222; color: #4fa3ff; 
            text-decoration: none; border: 1px solid #4fa3ff; border-radius: 4px; font-size: 12px; font-weight: bold;
        }
        .btn-link:hover { background: #4fa3ff; color: #000; }

        /* Paginación */
        .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 25px; align-items: center; }
        .page-btn { 
            background: #ff4444; color: white; border: none; padding: 10px 20px; 
            border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        .page-btn:disabled { background: #444; cursor: not-allowed; opacity: 0.7; }
        #pageInfo { color: #888; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Base de Datos - Bolivia</h1>
    <p class="subtitle">Consulta Pública v2.0</p>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Buscar por Nombre, Departamento o Profesión...">
    </div>

    <div id="loading" style="text-align: center; margin: 40px; color: #ff4444;">Cargando lista actualizada...</div>

    <div class="table-responsive">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Nombre Completo</th>
                    <th>Datos Personales</th>
                    <th>Historia / Descripción</th>
                    <th style="text-align: center;">Pruebas</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>

    <div class="pagination" id="paginationControls" style="display:none;">
        <button id="prevBtn" class="page-btn">⬅ Anterior</button>
        <span id="pageInfo">Página 1</span>
        <button id="nextBtn" class="page-btn">Siguiente ➡</button>
    </div>
    
    <div style="text-align:center; margin-top:30px; font-size:12px; color:#555;">
        Versión Tabla 2.0 - Información pública
    </div>
</div>

<script>
    // TU ENLACE CSV OFICIAL
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQuyZr5BY-sQrkjkd55DObWEQ4Jq-IN5orJciSlCHGKKvkPSMwMWhUuBAZn7fWpKUQKlMS4HybiFfz2/pub?gid=0&single=true&output=csv';

    let allData = [];
    let filteredData = [];
    let currentPage = 1;
    const itemsPerPage = 50; // 50 filas por página

    async function loadData() {
        try {
            // Añadimos un numero aleatorio al final (?v=...) para obligar a cargar datos nuevos siempre
            const response = await fetch(sheetUrl + '&v=' + Date.now());
            const data = await response.text();
            allData = parseCSV(data);
            filteredData = allData;
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('paginationControls').style.display = 'flex';
            renderTable();
        } catch (error) {
            console.error(error);
            document.getElementById('loading').innerHTML = 'Error al cargar. Verifica el enlace CSV.';
        }
    }

    function parseCSV(text) {
        const lines = text.split('\n').map(l => l.trim()).filter(l => l);
        // Saltamos encabezados (filas 0 a 5) y empezamos en la 6 (fila 7 del excel)
        return lines.slice(6).map(line => {
            // Separa por comas respetando comillas
            const v = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            const clean = v.map(val => val ? val.replace(/^"|"$/g, '').trim() : '');
            
            return {
                nombre: clean[1] || 'Anónimo',   // Columna B
                edad: clean[3] || '?',           // Columna D
                depto: clean[4] || 'Desconocido',// Columna E
                ciudad: clean[5] || '',          // Columna F
                profesion: clean[6] || '',       // Columna G
                historia: clean[8] || '',        // Columna I
                pruebas: clean[11] || ''         // Columna L
            };
        }).filter(item => item.nombre && !item.nombre.includes('Nombre completo'));
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const pageItems = filteredData.slice(start, end);

        if(pageItems.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 30px;">No se encontraron resultados</td></tr>';
            return;
        }

        pageItems.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="col-nombre">${item.nombre}</td>
                <td class="col-datos">
                    <span class="tag tag-depto">${item.depto}</span>
                    <br>📍 ${item.ciudad}
                    <br>🎂 ${item.edad} años
                    <br>💼 ${item.profesion}
                </td>
                <td class="col-historia">${item.historia}</td>
                <td class="col-pruebas">
                    ${item.pruebas ? `<a href="${item.pruebas}" target="_blank" class="btn-link">VER</a>` : '<span style="color:#444;">-</span>'}
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('pageInfo').innerText = `Página ${currentPage} de ${Math.ceil(filteredData.length / itemsPerPage) || 1}`;
        document.getElementById('prevBtn').disabled = currentPage === 1;
        document.getElementById('nextBtn').disabled = end >= filteredData.length;
        window.scrollTo(0, 0);
    }

    // Buscador
    document.getElementById('searchInput').addEventListener('keyup', (e) => {
        const term = e.target.value.toLowerCase();
        filteredData = allData.filter(item => 
            item.nombre.toLowerCase().includes(term) || 
            item.depto.toLowerCase().includes(term) || 
            item.ciudad.toLowerCase().includes(term) ||
            item.profesion.toLowerCase().includes(term)
        );
        currentPage = 1;
        renderTable();
    });

    // Controles Paginación
    document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentPage > 1) { currentPage--; renderTable(); }
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
        if ((currentPage * itemsPerPage) < filteredData.length) { currentPage++; renderTable(); }
    });

    loadData();
</script>

</body>
</html>
