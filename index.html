<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Pública Bolivia</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 98%; margin: 0 auto; } /* Ocupa casi toda la pantalla */
        
        h1 { color: #ff4444; text-align: center; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 2px; }
        p.subtitle { text-align: center; color: #888; margin-bottom: 25px; font-size: 14px; }

        /* --- BUSCADOR --- */
        .search-container { text-align: center; margin-bottom: 20px; }
        .search-box { 
            width: 100%; max-width: 500px; padding: 12px 20px; font-size: 16px; 
            border-radius: 25px; border: 1px solid #444; background: #222; color: white; outline: none;
        }
        .search-box:focus { border-color: #ff4444; background: #333; }

        /* --- TABLA (SCROLL HORIZONTAL) --- */
        .table-responsive { overflow-x: auto; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; min-width: 1800px; } /* Ancho forzado para que quepan todas las columnas */
        
        thead { background: #b71c1c; color: white; }
        th { padding: 12px 8px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; border-right: 1px solid #a31515; white-space: nowrap; }
        td { padding: 10px 8px; border-bottom: 1px solid #333; border-right: 1px solid #333; font-size: 13px; vertical-align: top; color: #ddd; }
        
        /* Filas Zebra */
        tr:nth-child(even) { background-color: #252525; }
        tr:hover { background-color: #333; transition: 0.2s; }

        /* --- ANCHOS DE COLUMNAS (Ajustados a tu Sheet) --- */
        .col-nro { width: 40px; text-align: center; font-weight: bold; color: #ff4444; }
        .col-nombre { width: 200px; font-weight: bold; color: #fff; }
        .col-genero { width: 80px; }
        .col-edad { width: 50px; text-align: center; }
        .col-depto { width: 100px; }
        .col-ciudad { width: 100px; }
        .col-profesion { width: 150px; font-style: italic; color: #aaa; }
        .col-donde { width: 150px; color: #4fa3ff; }
        .col-historia { min-width: 350px; line-height: 1.5; color: #ccc; white-space: pre-wrap; background: #181818; } /* Fondo un poco mas oscuro para resaltar */
        .col-its { width: 100px; font-weight: bold; }
        .col-redes { width: 150px; word-break: break-all; font-size: 11px; color: #aaa; }
        .col-pruebas { width: 80px; text-align: center; }

        /* --- TAGS ITS --- */
        .tag-danger { color: #ff4444; }
        .tag-safe { color: #4caf50; }

        /* --- BOTÓN PRUEBAS --- */
        .btn-link { 
            display: inline-block; padding: 4px 8px; background: #222; color: #4fa3ff; 
            text-decoration: none; border: 1px solid #4fa3ff; border-radius: 4px; font-size: 11px; font-weight: bold;
        }
        .btn-link:hover { background: #4fa3ff; color: #000; }

        /* --- PAGINACIÓN --- */
        .pagination { display: flex; justify-content: center; gap: 5px; margin-top: 25px; align-items: center; flex-wrap: wrap; }
        .page-btn { 
            background: #333; color: white; border: 1px solid #444; padding: 8px 12px; 
            border-radius: 4px; cursor: pointer; font-size: 14px;
        }
        .page-btn:hover { background: #555; }
        .page-btn.active { background: #ff4444; border-color: #ff4444; font-weight: bold; }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    </style>
</head>
<body>

<div class="container">
    <h1>Base de Datos - Bolivia</h1>
    <p class="subtitle">Consulta Pública v5.0 (Columnas Separadas)</p>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Buscar por Nombre, Apodo o Ciudad...">
    </div>

    <div id="loading" style="text-align: center; margin: 40px; color: #ff4444;">Cargando base de datos completa...</div>

    <div class="table-responsive">
        <table id="dataTable">
            <thead>
                <tr>
                    <th class="col-nro">#</th>
                    <th class="col-nombre">Nombre Completo</th>
                    <th class="col-genero">Género</th>
                    <th class="col-edad">Edad</th>
                    <th class="col-depto">Depto</th>
                    <th class="col-ciudad">Ciudad</th>
                    <th class="col-profesion">Profesión</th>
                    <th class="col-donde">Donde lo conociste</th>
                    <th class="col-historia">Descripción de la Infidelidad</th>
                    <th class="col-its">ITS/ETS</th>
                    <th class="col-redes">Redes Sociales</th>
                    <th class="col-pruebas">Pruebas</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="pagination" id="paginationContainer" style="display:none;"></div>
</div>

<script>
    // ==========================================
    // ¡PEGA TU ENLACE CSV AQUÍ!
    // ==========================================
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQuyZr5BY-sQrkjkd55DObWEQ4Jq-IN5orJciSlCHGKKvkPSMwMWhUuBAZn7fWpKUQKlMS4HybiFfz2/pub?gid=0&single=true&output=csv';

    let allData = [];
    let filteredData = [];
    let currentPage = 1;
    const itemsPerPage = 100; // 100 POR PÁGINA

    async function loadData() {
        try {
            const response = await fetch(sheetUrl + '&v=' + Date.now());
            const text = await response.text();
            
            allData = parseCSVRegex(text);
            
            // Ordenar alfabéticamente por Nombre (Col B)
            allData.sort((a, b) => a.nombre.toLowerCase().localeCompare(b.nombre.toLowerCase()));

            filteredData = allData;
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('paginationContainer').style.display = 'flex';
            renderTable();
            renderPagination();
        } catch (error) {
            console.error(error);
            document.getElementById('loading').innerHTML = 'Error al cargar. Verifica el enlace CSV.';
        }
    }

    // Parser REGEX (Más preciso para textos largos con comas)
    function parseCSVRegex(text) {
        const lines = text.split('\n').map(l => l.trim()).filter(l => l);
        // Saltamos las 6 primeras filas de encabezados
        return lines.slice(6).map(line => {
            // Separa por comas pero ignora las comas dentro de comillas
            const v = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            const clean = v.map(val => val ? val.replace(/^"|"$/g, '').trim() : '');
            
            return {
                nro: clean[0] || '-',            // Col A
                nombre: clean[1] || 'Anónimo',   // Col B
                genero: clean[2] || '',          // Col C
                edad: clean[3] || '',            // Col D
                depto: clean[4] || '',           // Col E
                ciudad: clean[5] || '',          // Col F
                profesion: clean[6] || '',       // Col G
                donde: clean[7] || '',           // Col H
                historia: clean[8] || '',        // Col I
                its: clean[9] || '',             // Col J
                redes: clean[10] || '',          // Col K
                pruebas: clean[11] || ''         // Col L
            };
        }).filter(item => item.nombre && !item.nombre.includes('Nombre completo'));
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const pageItems = filteredData.slice(start, end);

        if(pageItems.length === 0) {
            tbody.innerHTML = '<tr><td colspan="12" style="text-align:center; padding: 30px;">No se encontraron resultados</td></tr>';
            return;
        }

        pageItems.forEach(item => {
            // Estilo para ITS (Rojo si hay algo sospechoso)
            let itsClass = '';
            if(item.its && (item.its.toLowerCase().includes('si') || item.its.toLowerCase().includes('sí'))) {
                itsClass = 'tag-danger';
            } else if (item.its) {
                itsClass = 'tag-safe';
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="col-nro">${item.nro}</td>
                <td class="col-nombre">${item.nombre}</td>
                <td class="col-genero">${item.genero}</td>
                <td class="col-edad">${item.edad}</td>
                <td class="col-depto">${item.depto}</td>
                <td class="col-ciudad">${item.ciudad}</td>
                <td class="col-profesion">${item.profesion}</td>
                <td class="col-donde">${item.donde}</td>
                <td class="col-historia">${item.historia}</td>
                <td class="col-its ${itsClass}">${item.its}</td>
                <td class="col-redes">${item.redes}</td>
                <td class="col-pruebas">
                    ${item.pruebas ? `<a href="${item.pruebas}" target="_blank" class="btn-link">VER</a>` : ''}
                </td>
            `;
            tbody.appendChild(tr);
        });
        
        window.scrollTo(0, 0);
    }

    function renderPagination() {
        const container = document.getElementById('paginationContainer');
        container.innerHTML = '';
        const totalPages = Math.ceil(filteredData.length / itemsPerPage);
        
        if (totalPages <= 1) return;

        // Botones
        const prevBtn = document.createElement('button');
        prevBtn.innerText = '« Anterior';
        prevBtn.className = 'page-btn';
        prevBtn.disabled = currentPage === 1;
        prevBtn.onclick = () => { currentPage--; renderTable(); renderPagination(); };
        container.appendChild(prevBtn);

        // Indicador simple
        const info = document.createElement('span');
        info.style.color = '#888';
        info.style.margin = '0 10px';
        info.innerText = `Página ${currentPage} de ${totalPages}`;
        container.appendChild(info);

        const nextBtn = document.createElement('button');
        nextBtn.innerText = 'Siguiente »';
        nextBtn.className = 'page-btn';
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.onclick = () => { currentPage++; renderTable(); renderPagination(); };
        container.appendChild(nextBtn);
    }

    // Buscador
    document.getElementById('searchInput').addEventListener('keyup', (e) => {
        const term = e.target.value.toLowerCase();
        filteredData = allData.filter(item => 
            item.nombre.toLowerCase().includes(term) || 
            item.depto.toLowerCase().includes(term) || 
            item.ciudad.toLowerCase().includes(term) ||
            item.nro.toString().includes(term)
        );
        currentPage = 1;
        renderTable();
        renderPagination();
    });

    loadData();
</script>

</body>
</html>
