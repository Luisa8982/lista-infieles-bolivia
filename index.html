<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Pública Bolivia</title>
    <style>
        /* ESTILO GENERAL */
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        h1 { color: #ff4444; text-align: center; text-transform: uppercase; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #888; margin-bottom: 25px; font-size: 14px; }

        /* BUSCADOR */
        .search-container { text-align: center; margin-bottom: 20px; }
        .search-box { 
            width: 100%; max-width: 400px; padding: 10px 15px; font-size: 16px; 
            border-radius: 5px; border: 1px solid #333; background: #1e1e1e; color: white; outline: none;
        }
        .search-box:focus { border-color: #ff4444; }

        /* TABLA DE DATOS (Estilo Excel Oscuro) */
        .table-wrapper { overflow-x: auto; border: 1px solid #333; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; background: #1e1e1e; }
        
        thead { background: #ff4444; color: white; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #333; font-size: 14px; vertical-align: top; }
        th { font-weight: bold; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        
        /* Filas intercaladas (Efecto Zebra) */
        tr:nth-child(even) { background-color: #252525; }
        tr:hover { background-color: #333; }

        /* Columnas especificas */
        .col-nombre { font-weight: bold; color: #fff; width: 20%; }
        .col-datos { width: 15%; color: #aaa; font-size: 12px; }
        .col-historia { width: 50%; line-height: 1.5; color: #ddd; }
        .col-pruebas { width: 15%; text-align: center; }

        /* Boton de Pruebas */
        .btn-link { 
            display: inline-block; padding: 5px 10px; background: #222; color: #4fa3ff; 
            text-decoration: none; border: 1px solid #4fa3ff; border-radius: 4px; font-size: 11px; 
        }
        .btn-link:hover { background: #4fa3ff; color: #000; font-weight: bold; }

        /* Paginación */
        .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 20px; align-items: center; }
        .page-btn { 
            background: #333; color: white; border: none; padding: 8px 16px; 
            border-radius: 4px; cursor: pointer; 
        }
        .page-btn:hover { background: #555; }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Responsive para celulares */
        @media (max-width: 600px) {
            th, td { padding: 10px 5px; font-size: 12px; }
            .col-datos { display: none; } /* Oculta edad/depto en celular vertical para ahorrar espacio */
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Base de Datos - Bolivia</h1>
    <p class="subtitle">Consulta Pública de Reportes</p>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Buscar por nombre, apellido o ciudad...">
    </div>

    <div id="loading" style="text-align: center;">Cargando lista...</div>

    <div class="table-wrapper">
        <table id="dataTable">
            <thead>
                <tr>
                    <th style="width: 25%;">Nombre Completo</th>
                    <th style="width: 15%;">Detalles</th>
                    <th style="width: 50%;">Historia</th>
                    <th style="width: 10%;">Pruebas</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>

    <div class="pagination" id="paginationControls" style="display:none;">
        <button id="prevBtn" class="page-btn">⬅ Anterior</button>
        <span id="pageInfo" style="color: #888;">Página 1</span>
        <button id="nextBtn" class="page-btn">Siguiente ➡</button>
    </div>
</div>

<script>
    // ==========================================
    // ¡PEGA TU ENLACE CSV AQUÍ ABAJO!
    // ==========================================
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQuyZr5BY-sQrkjkd55DObWEQ4Jq-IN5orJciSlCHGKKvkPSMwMWhUuBAZn7fWpKUQKlMS4HybiFfz2/pub?gid=0&single=true&output=csv';

    let allData = [];
    let filteredData = [];
    let currentPage = 1;
    const itemsPerPage = 50; // 50 filas por página para que se lea bien

    async function loadData() {
        try {
            const response = await fetch(sheetUrl);
            const data = await response.text();
            allData = parseCSV(data);
            filteredData = allData;
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('paginationControls').style.display = 'flex';
            
            renderTable();
        } catch (error) {
            console.error(error);
            document.getElementById('loading').innerHTML = 'Error al cargar. Verifica el enlace.';
        }
    }

    function parseCSV(text) {
        const lines = text.split('\n').map(l => l.trim()).filter(l => l);
        // Usamos una expresión regular más potente para leer CSV correctamente
        return lines.slice(6).map(line => {
            // Esta magia separa por comas pero ignora las comas que están dentro de "comillas"
            const v = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            const clean = v.map(val => val ? val.replace(/^"|"$/g, '').trim() : '');
            
            return {
                nombre: clean[1] || 'Anónimo',   // Columna B
                edad: clean[3] || '?',           // Columna D
                depto: clean[4] || '',           // Columna E
                ciudad: clean[5] || '',          // Columna F
                profesion: clean[6] || '',       // Columna G
                historia: clean[8] || '',        // Columna I
                pruebas: clean[11] || ''         // Columna L
            };
        }).filter(item => item.nombre && !item.nombre.includes('Nombre completo'));
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const pageItems = filteredData.slice(start, end);

        if(pageItems.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 20px;">No se encontraron resultados</td></tr>';
            return;
        }

        pageItems.forEach(item => {
            const tr = document.createElement('tr');
            
            // Construimos la fila
            tr.innerHTML = `
                <td class="col-nombre">${item.nombre}</td>
                <td class="col-datos">
                    <div style="color: #ff4444; font-weight:bold;">${item.depto}</div>
                    <div>${item.edad} años</div>
                    <div style="font-style:italic;">${item.profesion}</div>
                </td>
                <td class="col-historia">${item.historia}</td>
                <td class="col-pruebas">
                    ${item.pruebas ? `<a href="${item.pruebas}" target="_blank" class="btn-link">Ver Pruebas</a>` : '<span style="color:#555;">-</span>'}
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('pageInfo').innerText = `Página ${currentPage} de ${Math.ceil(filteredData.length / itemsPerPage) || 1}`;
        document.getElementById('prevBtn').disabled = currentPage === 1;
        document.getElementById('nextBtn').disabled = end >= filteredData.length;
        window.scrollTo(0, 0);
    }

    // Buscador
    document.getElementById('searchInput').addEventListener('keyup', (e) => {
        const term = e.target.value.toLowerCase();
        filteredData = allData.filter(item => 
            item.nombre.toLowerCase().includes(term) || 
            item.depto.toLowerCase().includes(term) || 
            item.profesion.toLowerCase().includes(term)
        );
        currentPage = 1;
        renderTable();
    });

    // Botones Paginación
    document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentPage > 1) { currentPage--; renderTable(); }
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
        if ((currentPage * itemsPerPage) < filteredData.length) { currentPage++; renderTable(); }
    });

    loadData();
</script>

</body>
</html>
